# Kiritek engineering/guardrails — PR y release.
# Este workflow SÓLO calcula contexto e invoca el CLI core: no contiene reglas
# ni evaluators. No requiere secretos (funciona en forks).
name: kiritek-engineering

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # el rango base..head completo; shallow ⇒ error operativo, nunca deny
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "20"
      # Versión exacta, instalación local (sin -g ni rangos).
      - run: npm install --no-save --no-package-lock kiritek-init@0.1.0
      - name: Evaluar guardrails (rango completo del PR)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          mkdir -p .kiritek/tmp
          npx --no-install kiritek-init guardrails scan --moment=pr --base="$BASE_SHA" --revision="$HEAD_SHA" \
            --offline --format=json > .kiritek/tmp/engineering-pr.json
      - name: Publicar reporte redactado
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kiritek-engineering-report
          path: .kiritek/tmp/engineering-pr.json
