name: Kiritek — auditoría semanal

on:
  schedule:
    - cron: "0 13 * * 1" # lunes 7am hora Kiritek (ajustar UTC según corresponda)
  workflow_dispatch: {} # permite correrlo manual desde la pestaña Actions

# Permisos mínimos: sólo lectura. La auditoría NO commitea ni empuja.
permissions:
  contents: read

concurrency:
  group: kiritek-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # actions/checkout v4.2.2 fijado por commit SHA inmutable.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0 # historial completo para la auditoría de commits

      - name: Auditar cumplimiento Kiritek
        env:
          KIRITEK_METRICS_WEBHOOK: ${{ secrets.KIRITEK_METRICS_WEBHOOK }}
        run: npx github:Kiritek-Pods/Framework-Kiritek#npx-release audit

      # En vez de commitear/empujar el reporte (push directo = inseguro y viola
      # la política de rama protegida), se sube como artefacto. Para persistir el
      # reporte en el repo, abrir un PR mediante un flujo con revisión, no push.
      - name: Subir reporte de cumplimiento como artefacto
        if: always()
        # actions/upload-artifact v4.4.3 fijado por commit SHA inmutable.
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882
        with:
          name: kiritek-compliance
          path: kiritek-compliance.md
          if-no-files-found: ignore
          retention-days: 30
